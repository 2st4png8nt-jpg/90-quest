name: Android APK

# Builds an installable APK on every push to main and attaches it to a GitHub Release.
# On your phone: open the repo's Releases page, tap the newest release, download the .apk.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: '1'

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "90-day-quest-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 90-day-quest-apk
          path: app/90-day-quest-build-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android test build ${{ github.run_number }}
          body: |
            Test build from commit ${{ github.sha }}.
            Download the .apk below on your Android phone and open it to install.
            (Android will ask you to allow installs from your browser the first time.)
          files: app/90-day-quest-build-*.apk
          make_latest: true
